name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.4.1

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

      - name: Importer le projet
        run: ./godot --headless --import || true

      - name: Tests unitaires
        run: ./godot --headless -s tests/run_tests.gd

      - name: Test d'intégration
        run: ./godot --headless --fixed-fps 60 res://tests/smoke_game.tscn
